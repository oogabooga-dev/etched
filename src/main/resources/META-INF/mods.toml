modLoader = "javafml"
loaderVersion = "[${forge_loader_version},48)"
issueTrackerURL = "https://github.com/oogabooga-dev/re-etched/issues"
license = "GPL-3.0-only and bundled third-party terms; original Etched resources reserved, see LICENSE"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = "${mod_description}"
logoFile = "${mod_id}.logo.png"
authors = "Moonflower Studio (original); oogabooga-dev (Re-Etched fork)"
credits = "Ocelot, Jackson, Farcr (Art), AstraZoey (Sound Design)"
displayURL = "https://github.com/oogabooga-dev/re-etched"

[modproperties.${ mod_id }]
catalogueImageIcon = "${mod_id}.icon.png"

[[dependencies.${ mod_id }]]
modId = "forge"
mandatory = true
versionRange = "[${forge_loader_version},48)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version},1.20.2)"
ordering = "AFTER"
side = "BOTH"
